[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
# Limite mémoire pour le build Next.js (éviter OOM sur Railway)
cmds = ["NODE_OPTIONS=--max-old-space-size=2048 pnpm run build"]

[start]
cmd = "pnpm start"

# Variables d'environnement pour optimiser l'utilisation de la mémoire
[variables]
NODE_OPTIONS = "--max-old-space-size=2048"
