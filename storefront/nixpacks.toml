[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm start"

# Variables d'environnement pour optimiser l'utilisation de la mémoire
[variables]
NODE_OPTIONS = "--max-old-space-size=2048"
