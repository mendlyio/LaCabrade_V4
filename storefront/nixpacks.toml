[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "npm run build",
  "cp -r .next/static .next/standalone/.next/",
  "cp -r public .next/standalone/"
]

[start]
cmd = "cd .next/standalone && HOSTNAME=0.0.0.0 PORT=${PORT:-3000} node server.js"

[variables]
NPM_CONFIG_PRODUCTION = "false"

